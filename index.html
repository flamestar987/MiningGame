<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#090d13"><title>Deep Digger — 3D-style Mining Arcade</title><link rel="stylesheet" href="style.css"></head><body><div id="game"><div class="scene"><div class="back-wall"></div><div class="left-wall"></div><div class="right-wall"></div><div class="floor"></div><div class="ore-vein"></div><div class="torch">🔥</div><div class="crosshair">+</div><div class="pickaxe-art">⛏️</div></div><div class="hud-left"><div class="top-icons"><button class="iconbtn" aria-label="Game menu">◈</button><button class="iconbtn" id="menuOpen">☰</button><button class="iconbtn" id="questOpen">▣</button></div><div class="hud-chip"><span class="coin">🪙</span><b id="coins">0</b></div><div class="hud-chip gems"><span class="coin">💎</span><b id="gems">0</b><button id="gemPlus">+</button></div></div><div class="top-center"><strong>Depth: <span id="depth" style="display:inline">1</span></strong><span id="layer">Stone Layer</span></div><nav class="side-menu"><button class="menu-btn" data-panel="backpack"><span>🎒</span>Backpack</button><button class="menu-btn" data-panel="shop"><span>🏪</span>Shop</button><button class="menu-btn" data-panel="upgrades"><span>⬆️</span>Upgrades</button><button class="menu-btn" data-panel="settings"><span>⚙️</span>Settings</button></nav><aside class="right-hud"><section class="hud-card"><h3>Current Ores</h3><div class="ore-row"><i class="ore-cube"></i>Stone <small>(Common)</small></div><div class="ore-row"><i class="ore-cube copper"></i>Copper <small>(Common)</small></div><div class="ore-row"><i class="ore-cube coal"></i>Coal <small>(Common)</small></div></section><section class="hud-card quest"><div class="quest-title"><span>❕</span>Main Quest</div><div class="quest-text" id="questText">Mine 50 stone blocks</div><div class="progress"><span id="questProgress"></span></div><div class="progress-label" id="questCount">0 / 50</div></section></aside><div class="joystick" aria-label="Movement joystick"></div><div class="bottom-hud"><div class="bars"><div class="bar health"><span>❤️ 100/100</span></div><div class="bar energy"><span>⚡ 100/100</span></div></div><div class="hotbar" id="hotbar"></div></div><div class="overlay" id="overlay"><section class="modal"><div class="modal-head"><h2 id="modalTitle">Backpack</h2><button class="close" id="closeModal">×</button></div><div id="modalContent"></div></section></div><div id="toast" class="toast"></div></div><script src="script.js"></script></body></html>
